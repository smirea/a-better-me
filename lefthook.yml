pre-commit:
  jobs:
    # Heals a worktree whose setup is missing or stale. CI and cloud agents don't have the command.
    - name: worktree-check
      run: '[ ! -x "$HOME/bin/agent-t3-worktree" ] || "$HOME/bin/agent-t3-worktree" check --heal'
    - group:
        parallel: true
        jobs:
          # One command: both fixers rewrite the same staged files, and in parallel one would overwrite the other's edit.
          - name: fix
            run: >-
              bunx oxlint --fix --no-error-on-unmatched-pattern {staged_files}
              && bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
            stage_fixed: true
          - name: typecheck
            glob: '*.{js,mjs,mts,ts,tsx,json,jsonc}'
            run: bun check
          - name: test
            glob: '*.{js,mjs,mts,ts,tsx}'
            run: bun --no-env-file scripts/test-changed.ts {staged_files}
          - name: swift-lint
            glob: '*.swift'
            run: bun app-ios/scripts/lint-swift.ts

# Swift suites run at push, not commit: they build and boot a simulator, which costs a minute or more.
pre-push:
  commands:
    # The same check as CI's "Changelog entry" job, so a missing entry fails before the PR opens.
    changelog:
      run: bun --no-env-file scripts/changelog.ts check --base "$(git merge-base HEAD origin/master)"
    test:
      # Not {push_files}: on a branch with no upstream it diffs against origin/master's tip, so once master moved, a
      # docs-only push ran the Swift suites of master's own merges.
      files: git diff --name-only "$(git merge-base HEAD '@{push}' 2>/dev/null || git merge-base HEAD origin/master)" HEAD
      glob: '*.{js,mjs,mts,ts,tsx,swift}'
      run: bun --no-env-file scripts/test-changed.ts {files}

pre-commit:
  jobs:
    # A linked worktree keeps working when the shared config says core.bare = true, so only the main checkout and T3
    # break, far from the cause. Failing here points at it the next time any worktree commits or pushes.
    - name: not-bare
      run: bun --no-env-file scripts/check-not-bare.ts
    # Heals a worktree whose setup is missing or stale. CI and cloud agents don't have the command.
    - name: worktree-check
      run: '[ ! -x "$HOME/bin/agent-t3-worktree" ] || "$HOME/bin/agent-t3-worktree" check --heal'
    - group:
        parallel: true
        jobs:
          # One command: both fixers rewrite the same staged files, and in parallel one would overwrite the other's edit.
          - name: fix
            run: >-
              bunx oxlint --fix --no-error-on-unmatched-pattern {staged_files}
              && bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
            stage_fixed: true
          - name: typecheck
            glob: '*.{js,mjs,mts,ts,tsx,json,jsonc}'
            run: bun check
          # The whole suite: it runs in under a second, and selecting tests by diff could miss one whose input is not an
          # import. Git exports GIT_DIR and GIT_INDEX_FILE to hooks, so a test that runs git in a temp directory would
          # act on this repository unless they are unset first.
          - name: test
            glob: '*.{js,mjs,mts,ts,tsx,json}'
            run: unset $(git rev-parse --local-env-vars); bun run test
          - name: generated
            run: bun scripts/check-generated.ts
          - name: swift-lint
            glob: '*.swift'
            run: bun app-ios/scripts/lint-swift.ts
          # Core's tests run on the Mac with no simulator (app-ios/Package.swift). The first run in a new worktree also
          # resolves and compiles the packages.
          - name: swift-test
            root: app-ios/
            glob: '*.swift'
            run: unset $(git rev-parse --local-env-vars); swift test --quiet

pre-push:
  commands:
    not-bare:
      run: bun --no-env-file scripts/check-not-bare.ts
    # The same check as CI's "Changelog entry" job, so a missing entry fails before the PR opens.
    changelog:
      run: bun --no-env-file scripts/changelog.ts check --base "$(git merge-base HEAD origin/master)"

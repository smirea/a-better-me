name: CI

on:
  pull_request:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A push to master deploys, and a newer push must not cancel a deploy halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The schema defaults that the committed readers and app-ios/Config/check-env.sh require. CI never runs env-manager,
# so no per-target values file exists: scripts that run from a subdirectory and xcodebuild read these instead. Nothing
# here is secret. A job that needs a credential takes it from a repository secret.
env:
  API_URL: http://127.0.0.1:6151
  API_PORT: 6151
  CLIENT_PORT: 6150
  APP_ENV: development

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.changes.outputs.swift }}
      assets: ${{ steps.changes.outputs.assets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: bun .github/scripts/changes.ts

  # Every PR that changes shipped code adds a changelog/ entry, which the iPhone app lists in More > Changelog.
  changelog:
    name: Changelog entry
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Check for a new entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun scripts/changelog.ts check --base "$BASE_SHA"

  bun:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        task: ["lint:ci", typecheck, test, build]
    env:
      CI: "true"
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('.bun-version') }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run ${{ matrix.task }}
        env:
          TASK: ${{ matrix.task }}
        run: bun run "$TASK"

  swift:
    name: ${{ matrix.task }} (Swift)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.changes.outputs.swift == 'true' && 'xcode-27' || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # `package` lints and runs Core's tests with `swift test`; `app` builds the app, watch app and widgets. Neither
        # boots a simulator.
        task: [package, app]
    env:
      SWIFT_DIRECTORY: app-ios
      CI: "true"
      LEFTHOOK: "0"
    steps:
      - name: Verify change detection
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGE_RESULT" = success
      - name: No relevant changes
        if: needs.changes.outputs.swift != 'true'
        run: echo "No Swift changes; ${{ matrix.task }} passed."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.swift == 'true'
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.changes.outputs.swift == 'true'
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.swift == 'true'
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('.bun-version') }}-
      - name: Install dependencies
        if: needs.changes.outputs.swift == 'true'
        run: bun install --frozen-lockfile

      - name: Identify Xcode and Swift toolchain
        if: needs.changes.outputs.swift == 'true'
        id: toolchain
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)
          test -n "$xcode" || { echo 'The app targets iOS 27 and needs Xcode 27 on the runner.'; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version
          echo "key=$( { xcodebuild -version; swift --version; } | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      # Package.resolved is untracked, so nothing in the checkout names the packages' versions. A key per run saves
      # each run's packages; a fixed key kept a months-old feedback-engine checkout, which a build used whenever
      # own-packages.ts could not reach GitHub to move the pin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.swift == 'true'
        with:
          path: |
            ${{ env.SWIFT_DIRECTORY }}/.build/repositories
            ${{ env.SWIFT_DIRECTORY }}/.build/checkouts
            ${{ env.SWIFT_DIRECTORY }}/.build/artifacts
            ${{ env.SWIFT_DIRECTORY }}/.build/SourcePackages
          key: ${{ runner.os }}-${{ runner.arch }}-spm-${{ steps.toolchain.outputs.key }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-spm-${{ steps.toolchain.outputs.key }}-
      - name: Run Swift task
        if: needs.changes.outputs.swift == 'true'
        run: bun .github/scripts/swift.ts "${{ matrix.task }}"

  # Only master's versions reach the bucket. A Release build of an unmerged branch uploads its own through `bun run env:ios`.
  assets:
    name: Upload app assets
    needs: changes
    if: ${{ github.event_name == 'push' && needs.changes.outputs.assets == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEFTHOOK: "0"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets with 'bun run secrets:github'."
            exit 1
          fi
      - name: Upload
        run: bun scripts/assets.ts upload

  deploy:
    name: Deploy the Worker
    needs: [bun, swift]
    if: ${{ github.event_name == 'push' && !cancelled() && needs.bun.result == 'success' && needs.swift.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEFTHOOK: "0"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets with 'bun run secrets:github'."
            exit 1
          fi
      - name: Required Worker secrets
        run: bun scripts/secrets.ts verify
      - name: Deploy
        run: bunx wrangler deploy

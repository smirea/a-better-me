name: CI

on:
  pull_request:
  push:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bun: ${{ steps.changes.outputs.bun }}
      swift: ${{ steps.changes.outputs.swift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          SCAFFOLD_TYPE: monorepo-swift
        run: bun .github/scripts/changes.ts

  bun:
    name: ${{ matrix.task }} (Bun)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [checks, tests, build]
    env:
      CI: 'true'
      LEFTHOOK: '0'
    steps:
      - name: Verify change detection
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGE_RESULT" = success
      - name: No relevant changes
        if: needs.changes.outputs.bun != 'true'
        run: echo "No Bun changes; ${{ matrix.task }} passed."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.bun == 'true'
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.changes.outputs.bun == 'true'
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.bun == 'true'
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('.bun-version') }}-
      - name: Install dependencies
        if: needs.changes.outputs.bun == 'true'
        run: bun install --frozen-lockfile
      - name: Generate environment from tracked defaults
        if: needs.changes.outputs.bun == 'true'
        run: bun run env:generate
      - name: Checks
        if: needs.changes.outputs.bun == 'true' && matrix.task == 'checks'
        run: bun run lint:ci && bun run typecheck
      - name: Tests
        if: needs.changes.outputs.bun == 'true' && matrix.task == 'tests'
        run: bun run test
      - name: Build
        if: needs.changes.outputs.bun == 'true' && matrix.task == 'build'
        run: bun run build
  swift:
    name: ${{ matrix.task }} (Swift)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.changes.outputs.swift == 'true' && 'xcode-27' || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        task: [checks, tests, build]
    env:
      SWIFT_DIRECTORY: app-ios
      CI: 'true'
      LEFTHOOK: '0'
    steps:
      - name: Verify change detection
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGE_RESULT" = success
      - name: No relevant changes
        if: needs.changes.outputs.swift != 'true'
        run: echo "No Swift changes; ${{ matrix.task }} passed."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.swift == 'true'
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.changes.outputs.swift == 'true'
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.swift == 'true'
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('.bun-version') }}-
      - name: Generate native environment from tracked defaults
        if: needs.changes.outputs.swift == 'true'
        run: |
          bun install --frozen-lockfile
          bun run env:generate

      - name: Identify Xcode and Swift toolchain
        if: needs.changes.outputs.swift == 'true'
        id: toolchain
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)
          test -n "$xcode" || { echo 'The app targets iOS 27 and needs Xcode 27 on the runner.'; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version
          echo "key=$( { xcodebuild -version; swift --version; } | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.swift == 'true'
        with:
          path: |
            ${{ env.SWIFT_DIRECTORY }}/.build/repositories
            ${{ env.SWIFT_DIRECTORY }}/.build/checkouts
            ${{ env.SWIFT_DIRECTORY }}/.build/artifacts
            ${{ env.SWIFT_DIRECTORY }}/.build/SourcePackages
          key: ${{ runner.os }}-${{ runner.arch }}-spm-${{ steps.toolchain.outputs.key }}-${{ hashFiles(format('{0}/Package.swift', env.SWIFT_DIRECTORY), format('{0}/**/Package.resolved', env.SWIFT_DIRECTORY)) }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-spm-${{ steps.toolchain.outputs.key }}-
      - name: Run Swift task
        if: needs.changes.outputs.swift == 'true'
        run: bun .github/scripts/swift.ts "${{ matrix.task }}"

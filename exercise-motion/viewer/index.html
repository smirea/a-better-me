<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Exercise Motion Library</title>
    <style>
      /*STYLE*/
    </style>
  </head>
  <body>
    <div id="app">
      <aside class="library-sidebar" id="library-drawer" hidden>
        <div class="drawer-head">
          <input id="library-search" type="search" placeholder="Search exercises, muscles, equipment…" autocomplete="off" />
          <div class="drawer-filters">
            <select id="filter-category" aria-label="Category"></select>
            <select id="filter-muscle" aria-label="Muscle"></select>
          </div>
          <div class="drawer-meta" id="drawer-meta"></div>
        </div>
        <div class="drawer-list" id="drawer-list" role="listbox" aria-label="Exercises"></div>
      </aside>
      <section class="stage">
        <header class="bar">
          <div class="segmented" id="exercises" role="tablist" aria-label="Exercise"></div>
          <div class="library-picker" id="library-picker" hidden>
            <button type="button" class="picker-trigger" id="picker-trigger" aria-expanded="false">
              <span class="picker-name" id="picker-name">Loading…</span>
              <span class="picker-count" id="picker-count"></span>
            </button>
          </div>
          <div class="stage-title" id="stage-title" hidden></div>
          <label class="setting-select" aria-label="Setting">
            <span>Setting</span>
            <select id="setting"></select>
          </label>
          <label class="load">
            <span id="load-label">Weight</span>
            <input id="load" type="range" min="0" max="200" step="2.5" />
            <output id="load-value"></output>
          </label>
        </header>
        <div class="canvas-wrap">
          <canvas id="canvas"></canvas>
          <div class="overlay top-left">
            <div class="segmented small" id="views" aria-label="Camera"></div>
          </div>
          <div class="overlay top-right">
            <div class="segmented small" id="modes" aria-label="Figure colour"></div>
            <div class="legend" id="legend"></div>
          </div>
          <div class="overlay bottom-left" id="variant-note" hidden></div>
        </div>
        <footer class="transport">
          <button id="play" aria-label="Pause"></button>
          <div class="timeline">
            <div class="phases" id="phases"></div>
            <div class="flags" id="flags"></div>
            <input id="scrub" type="range" min="0" step="1" aria-label="Frame" />
          </div>
          <div class="segmented small" id="speeds" aria-label="Speed"></div>
        </footer>
      </section>
      <aside class="panel">
        <div class="segmented" id="tabs" role="tablist"></div>
        <div class="panel-body" id="panel"></div>
      </aside>
    </div>
    <script id="data" type="application/json">
      __DATA__
    </script>
    <script id="lifter" type="application/octet-stream">__LIFTER__</script>
    <script id="muscle-map" type="text/plain">__MUSCLE_MAP__</script>
    <script type="module">
      /*SCRIPT*/
    </script>
  </body>
</html>

# Which rows PowerSync streams to a device. Shared by local Docker and production. There is one owner and no
# `user_id`, so every token that PowerSync accepts gets every synced row.
config:
  edition: 3
  # `2026-10-23T22:37:21.617Z`, the ISO 8601 a device writes, instead of Postgres's microseconds.
  timestamp_max_precision: milliseconds
streams:
  owner:
    auto_subscribe: true
    queries:
      - SELECT * FROM workout_templates
      - SELECT * FROM workout_sessions
      - SELECT * FROM custom_exercises
      - SELECT * FROM exercise_settings
      - SELECT * FROM settings
